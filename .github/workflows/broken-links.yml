name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/prettier.yml"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/prettier.yml"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          # Only the site's own content; template docs aren't published.
          # removed md files that include liquid tags
          args: --user-agent 'curl/7.54' --root-dir ${{ github.workspace }} --max-retries 3 --accept '200..=299,429' --exclude-path _pages/404.md --exclude-path _pages/blog.md --verbose --no-progress '_pages/*.md' '_news/*.md' '_posts/*.md'
